
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gravador de áudio • Central WhatsApp</title>
  <style>
    :root{
      --ink:#0f172a; --muted:#64748b; --line:#e5e7eb; --soft:#f8fafc;
      --green:#0f9f8f; --green2:#16a085; --send:#86d7a8; --send2:#6fce96;
      --danger:#dc2626; --shadow:0 24px 70px rgba(15,23,42,.16);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#eef2f7;color:var(--ink)}
    body{padding:16px}
    .card{width:min(620px,100%);min-height:calc(100vh - 32px);margin:auto;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column}
    .head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
    .title-wrap{display:flex;gap:13px;align-items:center}
    .title-icon{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#eef2f7;font-size:27px}
    h1{margin:0;font-size:28px;line-height:1.1}
    .subtitle{margin:9px 0 0;color:var(--muted);font-size:14px}
    .close{border:0;background:transparent;color:#64748b;font-size:32px;line-height:1;cursor:pointer;padding:2px 8px;border-radius:10px}
    .close:hover{background:#f1f5f9}
    .main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 0 18px}
    .mic-orb{width:158px;height:158px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#fff,#edf2f7);border:10px solid #f8fafc;box-shadow:0 0 0 2px #e2e8f0,0 12px 30px rgba(15,23,42,.07);font-size:76px;transition:.2s}
    .mic-orb.recording{animation:pulse 1.2s infinite;background:#fef2f2;box-shadow:0 0 0 2px #fecaca,0 0 0 13px rgba(239,68,68,.08)}
    @keyframes pulse{50%{transform:scale(1.035)}}
    .status{margin-top:26px;font-size:20px;font-weight:900}
    .timer{font-size:48px;font-weight:950;letter-spacing:-1px;margin:12px 0 22px}
    .primary{border:0;border-radius:14px;padding:15px 24px;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 8px 18px rgba(15,159,143,.20)}
    .primary.stop{background:linear-gradient(135deg,#dc2626,#b91c1c)}
    .preview{width:min(440px,100%);margin-top:18px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#f8fafc}
    audio{width:100%}
    .actions{display:grid;grid-template-columns:150px 1fr;gap:12px;margin-top:auto}
    .btn{border:0;border-radius:13px;padding:14px 18px;font-weight:900;font-size:15px;cursor:pointer}
    .cancel{background:#eef2f7;color:#172033}
    .send{background:linear-gradient(135deg,var(--send),var(--send2));color:#fff}
    .send:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.15)}
    .secure{margin-top:18px;border:1px solid #e2e8f0;background:#f8fafc;border-radius:14px;padding:13px 15px;color:#64748b;font-size:13px;text-align:center}
    .err{margin:14px auto 0;max-width:470px;padding:11px 13px;border-radius:12px;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;font-size:13px;font-weight:700}
    @media(max-width:560px){
      body{padding:8px}.card{min-height:calc(100vh - 16px);border-radius:19px;padding:18px}
      h1{font-size:22px}.title-icon{width:44px;height:44px;font-size:22px}.subtitle{font-size:12px}
      .mic-orb{width:130px;height:130px;font-size:61px}.timer{font-size:40px}
      .actions{grid-template-columns:1fr}.btn{width:100%}
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="head">
      <div>
        <div class="title-wrap">
          <div class="title-icon">🎙️</div>
          <h1>Gravador de áudio</h1>
        </div>
        <p class="subtitle">Grave, ouça e envie o áudio de volta para a Central.</p>
      </div>
      <button class="close" type="button" aria-label="Fechar" onclick="closeWindow()">×</button>
    </div>

    <section class="main">
      <div id="micOrb" class="mic-orb">🎙️</div>
      <div id="status" class="status">Pronto para gravar</div>
      <div id="timer" class="timer">00:00</div>
      <button id="recordBtn" class="primary" type="button" onclick="toggleRecording()">● Iniciar gravação</button>
      <div id="previewWrap" class="preview" hidden>
        <audio id="preview" controls></audio>
      </div>
      <div id="errorBox" class="err" hidden></div>
    </section>

    <div class="actions">
      <button class="btn cancel" type="button" onclick="closeWindow()">Cancelar</button>
      <button id="sendBtn" class="btn send" type="button" disabled onclick="sendToCentral()">📤 Enviar para a Central</button>
    </div>
    <div class="secure">🛡️ Seu áudio será enviado com segurança para a Central.</div>
  </main>

<script>
let stream=null, recorder=null, chunks=[], startedAt=0, timerId=null, dataUrl='', mime='audio/webm';

function setError(msg=''){
  const el=document.getElementById('errorBox');
  el.hidden=!msg; el.textContent=msg;
}
function fmt(sec){
  const m=String(Math.floor(sec/60)).padStart(2,'0');
  const s=String(sec%60).padStart(2,'0');
  return m+':'+s;
}
function startTimer(){
  startedAt=Date.now();
  clearInterval(timerId);
  timerId=setInterval(()=>{
    document.getElementById('timer').textContent=fmt(Math.floor((Date.now()-startedAt)/1000));
  },250);
}
function stopTimer(){clearInterval(timerId);timerId=null}
function stopTracks(){try{stream?.getTracks().forEach(t=>t.stop())}catch(e){} stream=null}

function supportedMime(){
  const list=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/ogg'];
  for(const x of list){try{if(MediaRecorder.isTypeSupported(x))return x}catch(e){}}
  return '';
}

async function toggleRecording(){
  if(recorder && recorder.state==='recording'){stopRecording();return}
  await startRecording();
}
async function startRecording(){
  setError('');
  if(!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder==='undefined'){
    setError('Este navegador não oferece suporte à gravação de áudio.');
    return;
  }
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const chosen=supportedMime();
    recorder=chosen?new MediaRecorder(stream,{mimeType:chosen}):new MediaRecorder(stream);
    mime=recorder.mimeType||chosen||'audio/webm';
    chunks=[]; dataUrl='';
    document.getElementById('previewWrap').hidden=true;
    document.getElementById('sendBtn').disabled=true;

    recorder.ondataavailable=e=>{if(e.data && e.data.size)chunks.push(e.data)};
    recorder.onstop=async()=>{
      stopTracks(); stopTimer();
      const blob=new Blob(chunks,{type:mime});
      if(blob.size>7*1024*1024){
        setError('O áudio ficou maior que 7 MB. Faça uma gravação menor.');
        resetUi(); return;
      }
      dataUrl=await blobToDataUrl(blob);
      const audio=document.getElementById('preview');
      audio.src=dataUrl;
      document.getElementById('previewWrap').hidden=false;
      document.getElementById('sendBtn').disabled=false;
      document.getElementById('status').textContent='Áudio pronto para enviar';
      document.getElementById('recordBtn').textContent='● Gravar novamente';
      document.getElementById('recordBtn').classList.remove('stop');
      document.getElementById('micOrb').classList.remove('recording');
    };

    recorder.start(250);
    startTimer();
    document.getElementById('status').textContent='Gravando...';
    document.getElementById('recordBtn').textContent='■ Parar gravação';
    document.getElementById('recordBtn').classList.add('stop');
    document.getElementById('micOrb').classList.add('recording');
  }catch(e){
    stopTracks();
    setError('Não foi possível acessar o microfone. Verifique a permissão do navegador.');
  }
}
function stopRecording(){
  try{if(recorder && recorder.state!=='inactive')recorder.stop()}catch(e){}
}
function resetUi(){
  document.getElementById('recordBtn').textContent='● Iniciar gravação';
  document.getElementById('recordBtn').classList.remove('stop');
  document.getElementById('micOrb').classList.remove('recording');
  document.getElementById('status').textContent='Pronto para gravar';
  document.getElementById('timer').textContent='00:00';
}
function blobToDataUrl(blob){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(String(r.result||'')); r.onerror=reject; r.readAsDataURL(blob);
  });
}
function sendToCentral(){
  if(!dataUrl)return;
  if(window.opener && !window.opener.closed){
    window.opener.postMessage({type:'CENTRAL_AUDIO_RECORDED',dataUrl,mime},'*');
    setTimeout(()=>window.close(),180);
  }else{
    setError('A Central não foi encontrada. Abra este gravador pelo botão “Gravar áudio” da Central.');
  }
}
function closeWindow(){
  try{if(recorder && recorder.state==='recording')recorder.stop()}catch(e){}
  stopTracks(); window.close();
}
window.addEventListener('beforeunload',stopTracks);
</script>
</body>
</html>
